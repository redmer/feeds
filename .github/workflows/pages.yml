name: Publish RSS feeds to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run every day at 5:30 and 17:30:
    - cron: "30 5,17 * * *"
  workflow_dispatch:

env:
  CI: true

jobs:
  publish-feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: feed-me-up-scotty/package-lock.json
      - name: Install Feed-Me-Up-Scotty
        run: npm ci && npm run build
        working-directory: feed-me-up-scotty
      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
        working-directory: feed-me-up-scotty
      # GitHub Actions does not natively support step retries;
      # retry the build once on failure:
      - name: Build
        run: node ./feed-me-up-scotty/dist/index.js || node ./feed-me-up-scotty/dist/index.js
      - name: Deploy to GitHub Pages
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email $GITHUB_ACTOR@users.noreply.github.com
          git remote add gh-pages-remote https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git
          git fetch --no-recurse-submodules
          git worktree add ./gh-pages gh-pages
          cd gh-pages
          git rm -r .
          cp -r ../public/. .
          git add .
          git commit --message="Deploying to GitHub Pages from $GITHUB_SHA"
          git push gh-pages-remote gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
